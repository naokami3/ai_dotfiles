# FastAPI のエントリーポイント検出ルール
# 同じファイルの APIRouter(prefix=...) はパスの前に付ける。include_router(prefix=...) や
# アプリ全体のプレフィックス（例: /api/v1）は別ファイルにあるため正規表現では解決せず、付かない。
name: fastapi
rules:
  - id: fastapi-route
    kind: http_endpoint
    files: ["**/*.py"]
    # パスは文字列リテラル・定数（@router.get(ITEMS_PATH)）・省略のいずれでも拾う
    pattern: '^[ \t]*@(?P<obj>\w+)\.(?P<method>get|post|put|patch|delete|head|options|api_route)\(\s*(?:path\s*=\s*)?(?:[rf]?["''](?P<path>[^"'']*)["'']|(?P<const>[A-Za-z_][\w.]*))?'
    context: '^(?P<obj>\w+)\s*=\s*APIRouter\([^)]*?\bprefix\s*=\s*["''](?P<prefix>[^"'']*)["'']'
    label: "{method|upper} {prefix}{path}{const} ({obj})"

  - id: fastapi-websocket
    kind: http_endpoint
    files: ["**/*.py"]
    pattern: '^[ \t]*@(?P<obj>\w+)\.websocket\(\s*(?:path\s*=\s*)?["''](?P<path>[^"'']*)["'']'
    label: "WS {path} ({obj})"

  - id: fastapi-add-api-route
    kind: http_endpoint
    files: ["**/*.py"]
    pattern: '\.add_api_route\(\s*["''](?P<path>[^"'']*)["'']'
    label: "{path} (add_api_route)"

  - id: fastapi-mount
    kind: other
    files: ["**/*.py"]
    pattern: '\b(?P<obj>\w+)\.mount\(\s*["''](?P<path>[^"'']*)["'']'
    label: "mount {path} ({obj})"

  - id: fastapi-background-task
    kind: background_job
    files: ["**/*.py"]
    pattern: '\.add_task\(\s*(?P<fn>[\w.]+)'
    label: "BackgroundTasks {fn}"
